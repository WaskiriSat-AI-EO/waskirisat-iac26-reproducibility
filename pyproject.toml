# Tooling configuration. The repo has no build system — this file exists only
# to make `ruff` and `mypy` deterministic in CI.

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Pinned to ruff's historical stable default (real-bug rules: pyflakes +
# import/syntax/runtime pycodestyle) so `ruff check .` is deterministic across
# ruff releases — 0.16 expanded its implicit default and turned CI red.
#
# The repo carries ~430 style-only findings under the broader rulesets
# (typing.Dict vs dict, Optional vs |, import sorting, ...). Opting into those
# is a deliberate future pass with the accompanying fixes, not a CI gate today.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# ── Pre-existing type-check debt, frozen 2026-09 ─────────────────────────────
# 14 mypy errors that predate the nina_thermal training / evaluation /
# quantization reconciliation (PRs #8-#11): torchvision's `Tensor | Module`
# attribute typing in the QAT wrappers, an un-annotated list and a narrowed
# Optional in run_acquisition, and matplotlib's moved `get_cmap`. The NEW
# nina_thermal modules are intentionally NOT listed here and must stay clean.
[[tool.mypy.overrides]]
module = [
    "nina_cloud.*",
    "shared.*",
    "nina_thermal.datagen.pipelines.run_acquisition",
    "nina_thermal.datagen.visualization.colormap",
    "nina_thermal.training.train_thermal",
    "nina_thermal.quantization.qat",
]
ignore_errors = true
