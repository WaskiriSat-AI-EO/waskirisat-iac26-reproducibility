name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        # CPU-only torch wheels: the default index now resolves to CUDA builds that
        # exhaust the runner's disk space.
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install CI tools
        run: pip install ruff mypy

      - name: Format check
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy nina_cloud/ nina_thermal/ shared/ --ignore-missing-imports

      - name: Tests
        run: pytest --tb=short -q

      - name: Reproduce paper items (HIL tables from committed raw results)
        run: python -m reproduce.check
